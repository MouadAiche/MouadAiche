<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="260"
  viewBox="0 0 760 260"
  role="img"
  aria-label="Monkeytype typing statistics"
>
  <style>
    .title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 23px;
      font-weight: 700;
      fill: #e2b714;
      letter-spacing: 1px;
    }

    .subtitle {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      fill: #646669;
    }

    .value {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 25px;
      font-weight: 700;
      fill: #d1d0c5;
    }

    .label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #646669;
      letter-spacing: 1px;
    }

    .mode {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #e2b714;
      letter-spacing: 1px;
    }
  </style>

  <!-- Card -->
  <rect
    x="1"
    y="1"
    width="758"
    height="258"
    rx="12"
    fill="#323437"
    stroke="#45474b"
    stroke-width="2"
  />

  <!-- Header icon -->
  <rect
    x="32"
    y="31"
    width="36"
    height="27"
    rx="4"
    fill="#e2b714"
  />

  <rect x="38" y="37" width="4" height="4" rx="1" fill="#323437"/>
  <rect x="45" y="37" width="4" height="4" rx="1" fill="#323437"/>
  <rect x="52" y="37" width="4" height="4" rx="1" fill="#323437"/>
  <rect x="59" y="37" width="4" height="4" rx="1" fill="#323437"/>

  <rect x="38" y="44" width="4" height="4" rx="1" fill="#323437"/>
  <rect x="45" y="44" width="4" height="4" rx="1" fill="#323437"/>
  <rect x="52" y="44" width="4" height="4" rx="1" fill="#323437"/>
  <rect x="59" y="44" width="4" height="4" rx="1" fill="#323437"/>

  <rect
    x="42"
    y="51"
    width="18"
    height="3"
    rx="1.5"
    fill="#323437"
  />

  <!-- Header -->
  <text x="82" y="47" class="title">
    MONKEYTYPE
  </text>

  <text x="82" y="66" class="subtitle">
    typing statistics
  </text>

  <!-- Separator -->
  <line
    x1="32"
    y1="91"
    x2="728"
    y2="91"
    stroke="#45474b"
  />

  <!-- WPM -->
  <text
    x="105"
    y="145"
    text-anchor="middle"
    class="value"
  >
    53 WPM
  </text>

  <text
    x="105"
    y="170"
    text-anchor="middle"
    class="label"
  >
    PERSONAL BEST
  </text>

  <!-- Accuracy -->
  <text
    x="287"
    y="145"
    text-anchor="middle"
    class="value"
  >
    94.0%
  </text>

  <text
    x="287"
    y="170"
    text-anchor="middle"
    class="label"
  >
    ACCURACY
  </text>

  <!-- Tests -->
  <text
    x="470"
    y="145"
    text-anchor="middle"
    class="value"
  >
    3,271
  </text>

  <text
    x="470"
    y="170"
    text-anchor="middle"
    class="label"
  >
    TESTS
  </text>

  <!-- Time -->
  <text
    x="653"
    y="145"
    text-anchor="middle"
    class="value"
  >
    14h 12m
  </text>

  <text
    x="653"
    y="170"
    text-anchor="middle"
    class="label"
  >
    TYPING TIME
  </text>

  <!-- Bottom line -->
  <line
    x1="32"
    y1="201"
    x2="728"
    y2="201"
    stroke="#45474b"
  />

  <!-- Mode -->
  <text
    x="728"
    y="228"
    text-anchor="end"
    class="mode"
  >
    TIME • 60 SECONDS
  </text>
</svg>